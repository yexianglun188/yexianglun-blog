# Kirameku 生产 Nginx 配置
#
# 80 端口：只保留 Let's Encrypt 的 HTTP-01 验证目录，其余全部 301 到 HTTPS。
# 443 端口：真正的业务配置，静态素材本地直出，其余请求转发给 Next.js 容器。
#
# 证书是 Let's Encrypt 的**IP 证书**（无域名可用，见 deploy/README.md）：
#   - 有效期只有 160 小时（约 6.6 天），靠 certbot 定时自动续期
#   - 只能用 http-01 / tls-alpn-01 验证，所以 80 端口的验证目录必须一直可访问
#   - 续期后需要让 Nginx 重新加载证书，由 certbot 的 deploy-hook 完成

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# 必须配：Nginx 在**启动时**就把 upstream 里的主机名解析成 IP 并长期缓存。
# 一旦 frontend/backend 容器重启换了 IP，Nginx 仍连旧地址，表现为
# 所有请求在 0.00xs 内立刻返回 502（快到不可能是超时）。
# 用变量形式的 proxy_pass 配合 Docker 内置 DNS，可以让它按 TTL 重新解析。
resolver 127.0.0.11 valid=30s ipv6=off;

# ============================================================
# 80：证书验证 + 跳 HTTPS
# ============================================================
server {
    listen 80;
    server_name _;

    # Let's Encrypt 的 HTTP-01 验证目录，配 HTTPS 之后也必须保留，
    # 否则 6 天后自动续期会失败。注意：同一 location 里 alias 与 root 不能同时写。
    location ^~ /.well-known/acme-challenge/ {
        alias /srv/certbot/.well-known/acme-challenge/;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# 443：业务
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 122.51.90.31;

    # 证书由宿主机 certbot 签发，通过只读卷挂进来
    ssl_certificate     /etc/letsencrypt/live/kirameku-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirameku-ip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 管理后台上传照片/视频时的体积上限
    client_max_body_size 64m;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;

    # ----------------------------------------------------------
    # 大体积静态素材：直接读盘返回，不经过 Node
    # 目录由 docker-compose 挂载到 /srv/assets
    # ----------------------------------------------------------
    location ^~ /live2d/ {
        alias /srv/assets/live2d/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /images/ {
        alias /srv/assets/images/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /audio/ {
        alias /srv/assets/audio/;
        expires 7d;
        access_log off;
        # <audio> 拖动进度依赖 Range 请求，静态文件由 nginx 原生支持
        try_files $uri =404;
    }

    # Next.js 构建产物（_next/static 内容带 hash，可长期缓存）
    location ^~ /_next/static/ {
        set $upstream_frontend "http://frontend:3000";
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------
    # 主站：Next.js（内部会把 /api/*、/uploads/*、/admin/* 转发给后端）
    # ----------------------------------------------------------
    location / {
        # 变量形式 + resolver：容器 IP 变了也能自动跟上，不必重启 Nginx
        set $upstream_frontend "http://frontend:3000";
        proxy_pass $upstream_frontend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 留言/访客上报这类请求要拿到访客真实 IP，后端会读这个头
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 音乐构件/流式图片较大，缓冲到磁盘而不是内存
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
