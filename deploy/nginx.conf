# Kirameku 生产 Nginx 配置
# 监听 80，静态素材本地直出，其余请求转发给 Next.js 容器。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # 管理后台上传照片/视频时的体积上限
    client_max_body_size 64m;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;

    # ----------------------------------------------------------
    # 大体积静态素材：直接读盘返回，不经过 Node
    # 目录由 docker-compose 挂载到 /srv/assets
    # ----------------------------------------------------------
    location ^~ /live2d/ {
        alias /srv/assets/live2d/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /images/ {
        alias /srv/assets/images/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /audio/ {
        alias /srv/assets/audio/;
        expires 7d;
        access_log off;
        # <audio> 拖动进度依赖 Range 请求，静态文件由 nginx 原生支持
        try_files $uri =404;
    }

    # Next.js 构建产物（_next/static 内容带 hash，可长期缓存）
    location ^~ /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------
    # 主站：Next.js（内部会把 /api/*、/uploads/*、/admin/* 转发给后端）
    # ----------------------------------------------------------
    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 留言/访客上报这类请求要拿到访客真实 IP，后端需信任该头
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 音乐构件/流式图片较大，缓冲到磁盘而不是内存
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
